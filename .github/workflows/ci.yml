name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements.txt
      - run: pip install pytest httpx pybind11==3.1.0
      - run: cmake -S cpp -B cpp/build -DPython3_EXECUTABLE=$(which python)
      - run: cmake --build cpp/build -j 2
      - run: ctest --test-dir cpp/build --output-on-failure
      # Not a bare `pytest`: python -m pytest adds the cwd (backend/) to
      # sys.path, which is what lets `from board import ...` / `from main
      # import app` resolve at all. A bare `pytest` invocation doesn't add
      # the cwd automatically and fails with ModuleNotFoundError instead.
      - run: python -m pytest
